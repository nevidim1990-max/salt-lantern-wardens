  <script>
  (()=>{
    'use strict';
    const ENGINE_CONFIG=Object.freeze({fixedDt:1/60,maxSteps:5,renderDeltaMax:.1,query:'debug',saveVersion:3,diagnosticLimit:300,projectilePool:256,particlePool:180,cellPadding:.12});

    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

    const curveValue=(curve,step,total=1)=>{if(typeof curve==='number')return curve;const d=curve||{},x=Math.max(0,Number(step)||0),base=Number(d.base??1),slope=Number(d.step??d.slope??.05),cap=Number(d.max??Infinity),min=Number(d.min??0);let v=base;switch(d.type){case'exponential':v=base*Math.pow(Number(d.rate)||1.08,x);break;case'logistic':{const k=Number(d.steepness)||8,mid=Number(d.midpoint??.5)*Math.max(1,total-1);v=Number(d.min??base)+(Number(d.max??2)-Number(d.min??base))/(1+Math.exp(-k*(x-mid)));break}case'stepped':v=base+Math.floor(x/Math.max(1,Number(d.interval)||1))*slope;break;case'polynomial':v=base+(Number(d.coefficient)||slope)*Math.pow(x,Number(d.power)||2);break;case'soft-cap':{const threshold=Number(d.threshold)||1;v=x<=threshold?base+x*slope:base+threshold*slope+(x-threshold)*slope*(Number(d.soft_factor)||.25);break}case'hard-cap':v=Math.min(cap,base+x*slope);break;case'diminishing-return':{const scale=Number(d.scale)||1;v=base+Number(d.limit??1)*x/(x+scale);break}default:v=base+x*slope}return clamp(v,min,cap)};

    class Diagnostics{
      constructor(){this.items=[];this.listeners=new Set()}
      report(source,category,severity,context,recovery){const item={source,category,severity,context:clone(context),recovery_behavior:recovery,at:Date.now()};this.items.push(item);if(this.items.length>ENGINE_CONFIG.diagnosticLimit)this.items.shift();for(const fn of this.listeners)fn(item);if(severity==='error')console.error('[ENGINE]',item);else if(severity==='warning')console.warn('[ENGINE]',item);return item}
      subscribe(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn)}
      snapshot(){return this.items.slice()}
    }
    const diagnostics=new Diagnostics();

    class EventBus{

    }
    class Registry{
      constructor(name){this.name=name;this.items=new Map()}
      register(id,value){if(!id||this.items.has(id))throw new Error(`registry.${this.name}.${id||'missing'}`);this.items.set(id,value);return value}
      get(id){return this.items.get(id)}
      has(id){return this.items.has(id)}
      entries(){return this.items.entries()}
    }

    class World{
      constructor(bus){this.bus=bus;this.nextId=1;this.alive=new Set();this.components=new Map();this.tags=new Map();this.decorations=[];this.version=0}
      create(bundle={},tags=[]){const id=this.nextId++;this.alive.add(id);for(const [name,value] of Object.entries(bundle))this.add(id,name,clone(value));this.tags.set(id,new Set(tags));this.bus.emit('ENTITY_CREATED',{entity_id:id});return id}
      add(id,name,data){if(!this.alive.has(id))return false;let store=this.components.get(name);if(!store){store=new Map();this.components.set(name,store)}store.set(id,data);this.version++;return true}
      remove(id,name){const ok=this.components.get(name)?.delete(id)||false;if(ok)this.version++;return ok}
      get(id,name){return this.components.get(name)?.get(id)}
      has(id,name){return this.components.get(name)?.has(id)||false}
      hasTag(id,tag){return this.tags.get(id)?.has(tag)||false}
      query(required=[]){if(!required.length)return Array.from(this.alive);const stores=required.map(n=>this.components.get(n));if(stores.some(s=>!s))return [];stores.sort((a,b)=>a.size-b.size);const ids=[];for(const id of stores[0].keys())if(this.alive.has(id)&&stores.every(s=>s.has(id)))ids.push(id);return ids}
      destroy(id){if(!this.alive.delete(id))return false;for(const s of this.components.values())s.delete(id);this.tags.delete(id);this.bus.emit('ENTITY_DESTROYED',{entity_id:id});this.version++;return true}
      clear(){for(const id of Array.from(this.alive))this.destroy(id);this.decorations.length=0}
      serialize(){const entities=[];for(const id of this.alive){const components={};for(const [name,store] of this.components)if(store.has(id))components[name]=clone(store.get(id));entities.push({id,components,tags:Array.from(this.tags.get(id)||[])})}return {nextId:this.nextId,entities}}

    }
    class System{constructor(id,services){this.id=id;this.s=services;this.initialized=false}initialize(){this.initialized=true}update(){}shutdown(){this.initialized=false}}
    class SystemRegistry{
      constructor(){this.systems=[];this.byId=new Map()}
      register(system,order=0){if(this.byId.has(system.id))throw new Error(`system.${system.id}.duplicate`);this.systems.push({system,order});this.systems.sort((a,b)=>a.order-b.order);this.byId.set(system.id,system)}

      update(dt){for(const x of this.systems)x.system.update(dt)}
      shutdown(){for(const x of this.systems.slice().reverse())x.system.shutdown()}
    }

    class ModifierStack{
      constructor(){this.items=new Map();this.nextId=1}
      add(target,component,value,definition){const m={id:definition.modifier_id||`m-${this.nextId++}`,target_component:component,target_value:value,operation:definition.operation||'multiplier',value:Number(definition.value)||0,condition:definition.condition||null,source:definition.source||'content',duration:definition.duration??null,remaining:definition.duration??null,priority:Number(definition.priority)||0,stacking_rule:definition.stacking_rule||'independent_instances',caps:definition.caps||null};const key=String(target);const list=this.items.get(key)||[];if(m.stacking_rule==='unique_source'){const old=list.findIndex(x=>x.source===m.source&&x.target_component===component&&x.target_value===value);if(old>=0)list.splice(old,1)}if(m.stacking_rule==='highest_only'){const old=list.findIndex(x=>x.target_component===component&&x.target_value===value&&x.operation===m.operation);if(old>=0&&list[old].value>=m.value)return list[old]}list.push(m);this.items.set(key,list);return m}

      compare(a,op,b){return ({eq:()=>a===b,neq:()=>a!==b,gt:()=>a>b,gte:()=>a>=b,lt:()=>a<b,lte:()=>a<=b,in:()=>Array.isArray(b)&&b.includes(a),contains:()=>Array.isArray(a)&&a.includes(b),mod_eq:()=>Number(a)%Number(b)===0,'%':()=>Number(a)%Number(b)===0}[op]||(()=>false))()}

    const baseAudioApply=AudioBus.prototype.applySettings;

    PlatformAdapter.prototype.saveProgress=function(key,data){try{if(this.sdk?.saveProgress){const result=this.sdk.saveProgress(key,data);if(result&&typeof result.then==='function')result.catch(e=>this.error('saveProgress',e))}localStorage.setItem(key,data);return true}catch(error){this.error('saveProgress',error);try{localStorage.setItem(key,data);return true}catch{return false}}};
    PlatformAdapter.prototype.loadProgress=function(key){try{const result=this.sdk?.loadProgress?.(key);if(result&&typeof result.then!=='function')return typeof result==='string'?result:JSON.stringify(result)}catch(error){this.error('loadProgress',error)}try{return localStorage.getItem(key)}catch{return null}};
    PlatformAdapter.prototype.clearProgress=function(key){try{this.sdk?.clearProgress?.(key)}catch(error){this.error('clearProgress',error)}try{localStorage.removeItem(key)}catch{}};
    SaveSystem.prototype.read=function(){
      try{const raw=this.s.platform?.loadProgress(this.key)??localStorage.getItem(this.key);if(!raw)return null;let value=typeof raw==='string'?JSON.parse(raw):raw;if(!value||!Number.isInteger(value.version))throw new Error('save.schema');if(value.checksum){const expected=value.checksum;delete value.checksum;if(expected!==this.hash(value)){if(value.last_good){diagnostics.report('SaveSystem','checksum_recovery','warning',{},'last good snapshot restored');value=value.last_good}else throw new Error('save.checksum')}}return this.migrate(value)}catch(error){diagnostics.report('SaveSystem','corrupt_save','warning',{message:error.message},'safe defaults used; original preserved');return null}
    };
    SaveSystem.prototype.save=function(patch={}){
      const old=this.current,last_good=old?{version:old.version,updated_at:old.updated_at,settings:clone(old.settings),meta_state:clone(old.meta_state),checkpoint:clone(old.checkpoint)}:null;
      const next={version:ENGINE_CONFIG.saveVersion,updated_at:Date.now(),settings:clone(this.s.state.settings||this.defaults()),meta_state:clone(this.s.state.meta||this.metaDefaults()),checkpoint:patch.checkpoint??old?.checkpoint??null,last_good};next.checksum=this.hash(next);
      try{const ok=this.s.platform?.saveProgress(this.key,JSON.stringify(next))??(localStorage.setItem(this.key,JSON.stringify(next)),true);if(ok){this.current=next;return true}throw new Error('save.write_failed')}catch(error){diagnostics.report('SaveSystem','write_failed','error',{message:error.message},'current session remains active');return false}
    };
    SaveSystem.prototype.reset=function(){this.s.platform?.clearProgress(this.key);this.current=null;this.s.state.settings=this.defaults();this.s.state.meta=this.metaDefaults();this.save()};
    function routeFlowAction(action,button){
      const ui=services.ui,state=services.state;
      if(action==='splash-title'){state.screen='title';ui.render()}
      else if(action==='title-play'){if(state.meta.intro_seen){state.screen='menu';ui.render()}else{state.screen='intro';ui.render()}}
      else if(action==='title-levels'){state.screen='menu';ui.render()}
      else if(action==='title-back'){state.screen='title';ui.render()}
      else if(action==='about'){state.returnTitle=state.screen==='title';state.screen='about';ui.render()}
      else if(action==='about-back'){state.screen=state.returnTitle?'title':'menu';ui.render()}
      else if(action==='intro-continue'||action==='intro-skip'){state.meta.intro_seen=true;services.save.save();beginStage(0)}
      else if(action==='select-stage'){state.selectedStageIndex=Number(button.dataset.stage);ui.render()}
      else if(action==='start-stage'){const index=Number(button.dataset.stage);if(stageUnlocked(index)){if(index===0)beginStage(index);else{state.pendingStageIndex=index;state.screen='narrative';ui.render()}}}
      else if(action==='start-selected'){const index=Number(state.selectedStageIndex)||0;if(stageUnlocked(index)){if(index>0){state.pendingStageIndex=index;state.screen='narrative';ui.render()}else beginStage(index)}}
      else if(action==='begin-stage')beginStage(Number(state.pendingStageIndex)||0)
      else if(action==='next-stage'){const next=(state.stageIndex||0)+1;if(next>=services.data.progression.stages_or_levels.length){state.screen='postgame';ui.render()}else if(stageUnlocked(next)){state.pendingStageIndex=next;state.screen='narrative';ui.render()}}
      else if(action==='postgame-replay'){state.meta.intro_seen=true;beginStage(0)}
      else if(action==='toggle-mute'){services.audio.mute(!services.audio.muted);ui.render()}
      else if(action==='sluice'){services.stages.openSluice()}
      else if(action==='lens'){const id=Number(state.selectedEntity),target=services.world.get(id,'Targeting'),tower=services.world.get(id,'Tower');if(target&&tower){tower.lens_mode=!tower.lens_mode;target.range*=tower.lens_mode?1.25:.8;target.priority_order=tower.lens_mode?['nearest','furthest_progress']:['furthest_progress','nearest'];services.audio.play('click_ui');ui.render()}}
      else return false;
      return true;
    }
    function attachFlowActions(){
      const route=event=>{const button=event.target.closest('[data-action]');if(button)routeFlowAction(button.dataset.action,button)};
      services.ui.root.addEventListener('click',route);services.ui.overlay.addEventListener('click',route);
      const originalHUD=services.ui.renderHUD.bind(services.ui);
      services.ui.renderHUD=function(){originalHUD();const stage=this.s.state.stage;if(!stage)return;const actions=[];if(stage.macro_index===2){const used=!!this.s.state.phase?.sluice_used;actions.push(`<button class="tiny" data-action="sluice" ${used?'disabled':''}>${this.t(used?'ui.sluice.used':'ui.signature.sluice')}</button>`)}if(stage.macro_index===4&&this.s.state.selectedEntity){actions.push(`<button class="tiny" data-action="lens">${this.t('ui.signature.lens')}</button>`)}if(actions.length){const bar=document.createElement('div');bar.className='toolbar';bar.innerHTML=actions.join('');this.root.appendChild(bar)}};
      document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;services.audio.unlock();services.audio.startMusic();services.audio.play('click_ui');if(button.dataset.action==='pause')services.audio.pauseMusic(true);if(button.dataset.action==='resume')services.audio.pauseMusic(false);if(button.dataset.action==='menu')services.audio.pauseMusic(true);if(routeFlowAction(button.dataset.action,button))event.stopPropagation()},{capture:true});
      try{services.audio.muted=localStorage.getItem('mute')==='true'}catch{services.audio.muted=false}
      services.bus.on('PHASE_COMPLETED',event=>{services.audio.play('checkpoint');if((Number(event.index)+1)%3===0)services.platform.interstitialAd()});
      services.bus.on('STAGE_COMPLETED',event=>services.audio.play(event.won?'success_level':'fail_level'));
    }
      class GameplayCollisionSystem extends System{
      update(){const ids=this.s.world.query(['Collider','Transform','Sprite']).filter(id=>this.s.world.get(id,'Sprite').layer==='gameplay');for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=ids[i],b=ids[j],ta=this.s.world.get(a,'Transform'),tb=this.s.world.get(b,'Transform'),ca=this.s.world.get(a,'Collider'),cb=this.s.world.get(b,'Collider');if(Math.hypot(ta.x-tb.x,ta.y-tb.y)<=Number(ca.radius||0)+Number(cb.radius||0))this.s.bus.emit('GAMEPLAY_COLLISION',{a,b})}}
    }
    class PresentationSyncSystem extends System{update(){this.s.adapter.sync()}}
    class InputSystem extends System{
      initialize(){super.initialize();this.handler=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName))return;const keys=this.s.data?.input?.keyboard||{};const command=Object.keys(keys).find(k=>keys[k]===e.code);if(command){e.preventDefault();this.s.bus.emit(`COMMAND_${command.toUpperCase()}`,{device:'keyboard'})}else if(e.code==='Escape'){e.preventDefault();if(this.s.state.screen==='game')this.s.ui.handle({target:{closest:()=>({dataset:{action:'pause'}})}});else if(this.s.state.screen==='pause')this.s.ui.handle({target:{closest:()=>({dataset:{action:'resume'}})}})}else if(e.code==='Space'&&this.s.state.screen==='game'){e.preventDefault();this.s.bus.emit('COMMAND_LAUNCH_PHASE',{})}};window.addEventListener('keydown',this.handler)}
      update(){const pads=navigator.getGamepads?.()||[];const pad=Array.from(pads).find(Boolean);if(!pad)return;const mapping=this.s.data?.input?.gamepad||{};for(const [button,command] of Object.entries(mapping)){const index=Number(button);if(pad.buttons[index]?.pressed&&!this.lastPadButtons?.has(index)){this.s.bus.emit(`COMMAND_${String(command).toUpperCase()}`,{device:'gamepad'})}}this.lastPadButtons=new Set(pad.buttons.map((b,i)=>b.pressed?i:-1).filter(i=>i>=0))}
      shutdown(){super.shutdown();window.removeEventListener('keydown',this.handler)}
    }
    class FixedLoop{
      constructor(s){this.s=s;this.accumulator=0;this.alpha=0;this.steps=0;this.lastDelta=0;this.enabled=true;this.hitStop=0;this.warningCooldown=0;this.s.bus.on('ENEMY_DEFEATED',()=>this.hitStop=Math.max(this.hitStop,.035))}
      frame(deltaMs){if(!this.enabled)return;const delta=Math.min(ENGINE_CONFIG.renderDeltaMax,Math.max(0,deltaMs/1000));this.lastDelta=delta;this.warningCooldown=Math.max(0,this.warningCooldown-delta);if(!this.s.state.paused&&this.s.state.screen==='game'){if(this.hitStop>0)this.hitStop=Math.max(0,this.hitStop-delta);else this.accumulator+=delta;let n=0;while(this.accumulator>=ENGINE_CONFIG.fixedDt&&n<ENGINE_CONFIG.maxSteps){try{this.s.systems.update(ENGINE_CONFIG.fixedDt*(Number(this.s.state.waveSpeed)||1));this.s.bus.flush()}catch(error){diagnostics.report('FixedLoop','critical_update','error',{message:error.message,stack:error.stack},'simulation paused; restore last checkpoint');this.s.state.paused=true;this.s.state.screen='pause';this.s.ui.render();break}this.accumulator-=ENGINE_CONFIG.fixedDt;n++;this.steps++}if(n===ENGINE_CONFIG.maxSteps)this.accumulator=Math.min(this.accumulator,ENGINE_CONFIG.fixedDt)}else this.s.bus.flush();this.alpha=this.accumulator/ENGINE_CONFIG.fixedDt;this.s.adapter.sync();const enemies=this.s.world.query(['PathFollower']).length,critical=this.s.state.lives<Math.max(2,(Number(this.s.state.stage?.objective_integrity)||20)*.3),balance=Number(this.s.state.balances[this.s.primaryResource])||0,threshold=Number(this.s.data?.economy?.low_resource_threshold)||0;if(critical||threshold>0&&balance<=threshold){this.s.audio.setMusicIntensity(1);if(this.warningCooldown===0){this.warningCooldown=5;this.s.bus.emit('LOW_RESOURCE_WARNING',{resource_id:this.s.primaryResource,balance,integrity:this.s.state.lives})}}else this.s.audio.setMusicIntensity(enemies>5?.9:enemies>0?.7:.2)}
      shutdown(){this.enabled=false;this.s.systems.shutdown();this.s.adapter.shutdown();this.s.audio.shutdown()}
    }
    class BoardScene extends Phaser.Scene{
      constructor(){super({key:'FactoryBoard'})}
      preload(){const manifest=services.data?.assets||{};for(const [group,loader] of [['images','image'],['backgrounds','image'],['sprites','image'],['audio','audio'],['music','audio']])for(const item of manifest[group]||[]){if(!item.asset_id||!item.src)continue;try{this.load[loader](item.asset_id,item.src)}catch(error){diagnostics.report('AssetLoader','manifest_entry','warning',{asset_id:item.asset_id,message:error.message},'procedural placeholder used')}}this.load.on('loaderror',file=>diagnostics.report('AssetLoader','missing_asset','warning',{key:file.key,src:file.src},'procedural placeholder used'))}
      create(){services.adapter.attach(this);services.adapter.setRoute(services.currentRoute());services.loop=new FixedLoop(services);services.ui.render();if(services.state.debug)window.EngineTestHarness.runAll().then(results=>{services.state.debugResults=results;services.ui.render()})}
      update(time,delta){services.loop?.frame(delta)}
    }
    function installSystems(){
      services.save.initialize();services.platform.initialize();services.ui=new UIController(services);services.checkpoints=new CheckpointSystem('CheckpointSystem',services);services.stages=new StageSystem('StageSystem',services);services.objectives=new ObjectiveSystem('ObjectiveSystem',services);
      const list=[[new InputSystem('InputSystem',services),0],[services.stages,10],[new PlacementSystem('PlacementSystem',services),20],[new FSMSystem('FSMSystem',services),30],[new PathMovementSystem('PathMovementSystem',services),40],[new TargetingSystem('TargetingSystem',services),50],[new AttackSystem('AttackSystem',services),60],[new ProjectileSystem('ProjectileSystem',services),70],[new DamageSystem('DamageSystem',services),80],[new EconomySystem('EconomySystem',services),90],[services.objectives,100],[services.checkpoints,110],[new AchievementSystem('AchievementSystem',services),120],[new RuleSystem('RuleSystem',services),130],[new ModifierSystem('ModifierSystem',services),140],[new GameplayCollisionSystem('GameplayCollisionSystem',services),150],[new PresentationSyncSystem('PresentationSyncSystem',services),160]];
      for(const [system,order] of list)services.systems.register(system,order);services.systems.initialize();
      services.bus.on('UI_STATE_CHANGED',()=>services.ui.render());services.bus.on('RESOURCE_CHANGED',e=>{if(e.reason!=='production'&&services.state.screen==='game'){services.ui.render();services.ui.animateCounter('resource',e.before,e.after)}});services.bus.on('OBJECTIVE_PROGRESS',e=>{if(services.state.screen==='game'){services.ui.render();services.ui.animateCounter('lives',e.before,e.lives)}});services.bus.on('LOW_RESOURCE_WARNING',()=>{if(services.state.screen==='game'){services.ui.render();services.ui.root.insertAdjacentHTML('afterbegin',`<div class="tag critical resource-warning">${services.ui.t('ui.warning.resource')}</div>`);setTimeout(()=>services.ui.root.querySelector('.resource-warning')?.remove(),2800);services.audio.play('warning',1)}});
      services.bus.on('BUILD_REJECTED',()=>services.audio.play('reject',.6));services.bus.on('BUILD_PLACED',()=>services.audio.play('build',.7));services.bus.on('TOWER_UPGRADED',()=>services.audio.play('upgrade',.8));
      services.bus.on('GAMEPLAY_START',()=>services.platform.gameplayStart());services.bus.on('GAMEPLAY_STOP',()=>services.platform.gameplayStop());
      services.bus.on('STAGE_COMPLETED',e=>{const stage=services.state.stage,amount=Number(e.won?stage?.meta_reward?.amount:stage?.failure_reward?.amount)||0;services.state.meta.currency=(services.state.meta.currency||0)+amount;const prior=services.state.meta.records?.[e.stage_id]||{};services.state.meta.records??={};services.state.meta.records[e.stage_id]={best_score:Math.max(Number(prior.best_score)||0,Number(e.score)||0),best_leaks:Math.min(Number(prior.best_leaks??Infinity),Number(services.state.stats.leaks)||0),clears:(prior.clears||0)+(e.won?1:0)};services.state.meta.completed_stages??=[];if(e.won&&!services.state.meta.completed_stages.includes(e.stage_id))services.state.meta.completed_stages.push(e.stage_id);services.save.save()});
      services.bus.on('AD_RESULT',e=>{if(e.ok&&e.kind==='reward')services.bus.emit('REWARD_GRANTED',{source:'ad',reward_id:e.reward_id})});services.bus.on('META_REWARD_REQUESTED',e=>{services.state.meta.currency=(services.state.meta.currency||0)+Number(e.reward?.amount||0);services.save.save()});services.ui.init();
      document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='save-now')services.save.save();if(action==='tutorial-replay'&&services.data.progression.stages_or_levels.length){services.state.meta.tutorial_step=0;services.state.meta.tutorial_complete=false;services.ui.start(0);services.state.tutorialVisible=true;services.ui.render()}});
    }
    function initializeGame(){if(!window.Phaser){diagnostics.report('Runtime','phaser_missing','error',{},'place phaser.min.js beside index.html');services.state.screen='error';services.ui?.render();return}const resolution=Math.min(2,window.devicePixelRatio||1);services.game=new Phaser.Game({type:Phaser.CANVAS,parent:'phaser',backgroundColor:'#12232b',width:1280,height:720,resolution,physics:{default:'arcade',arcade:{gravity:{x:0,y:0},debug:false,fps:60}},scale:{mode:Phaser.Scale.RESIZE,width:1280,height:720,autoCenter:Phaser.Scale.CENTER_BOTH},render:{antialias:true,pixelArt:false,roundPixels:true},scene:[BoardScene]});document.addEventListener('visibilitychange',()=>{if(document.hidden&&services.state.screen==='game'){services.state.paused=true;services.audio.pauseMusic(true);services.bus.emit('GAMEPLAY_STOP',{reason:'hidden'});services.ui.render()}})}

    window.EngineTestHarness={
      async runAll(){const results=[];const test=(id,fn)=>{try{const evidence=fn();results.push({TEST_ID:id,purpose:id,input:'deterministic in-memory fixture',expected:'pass',actual:evidence,status:'PASS',evidence:String(evidence)})}catch(error){results.push({TEST_ID:id,purpose:id,input:'deterministic in-memory fixture',expected:'pass',actual:error.message,status:'FAIL',evidence:error.stack||error.message})}};test('ECS-01',()=>{const b=new EventBus(),w=new World(b),id=w.create({Transform:{x:0},Health:{current:3}});if(w.query(['Transform','Health']).length!==1)throw Error('query');w.add(id,'Velocity',{speed:1});w.remove(id,'Velocity');if(w.has(id,'Velocity'))throw Error('runtime composition');return 'create/query/add/remove passed'});test('EVENT-01',()=>{const b=new EventBus();let n=0;b.on('x',()=>n++);b.emit('x');b.emit('x',{},true);if(n!==1)throw Error('sync delivery');b.flush();if(n!==2)throw Error('deferred delivery');return 'synchronous and next-frame delivery passed'});test('MOD-01',()=>{const m=new ModifierStack();m.add(1,'Attack','damage',{operation:'flat',value:2});m.add(1,'Attack','damage',{operation:'multiplier',value:1.5});if(m.evaluate(1,'Attack','damage',4)!==9)throw Error('modifier formula');return 'flat + multiplier stack passed'});test('SAVE-01',()=>{const original=services.save.current;services.state.settings={...services.save.defaults()};const ok=services.save.save();services.save.current=original;if(!ok)throw Error('localStorage write');return 'versioned local save write passed'});test('DATA-01',()=>{if(services.data){const v=validateGameData(services.data);return `validated ${v.entityCount} archetypes, ${v.stageCount} stages, ${v.errors.length} errors`}return 'empty-data validation path remains recoverable'});test('DECOR-01',()=>{const phase={decorative_layout:[{entity_id:'synthetic-a',instance_count:1,render_layer:'background_far',z_index:-2,has_collision:false,parallax_factor:.2,row:0,col:0},{entity_id:'synthetic-b',instance_count:1,render_layer:'background_mid',z_index:0,has_collision:false,parallax_factor:.5,row:null,col:null,x:.4,y:.3},{entity_id:'synthetic-c',instance_count:1,render_layer:'foreground',z_index:2,has_collision:false,parallax_factor:.8,row:1,col:1}]};const output=services.adapter.loadDecorative(phase,{rows:4,cols:4});const ok=output.length===3&&new Set(output.map(x=>x.render_layer)).size===3&&output.every(x=>x.has_collision===false);services.adapter.destroyDecorations();services.world.decorations=[];if(!ok)throw Error('decorative isolation');return '3 layers, grid/free coordinates, parallax values and zero collision passed'});return results}
    };
    const runHarness=window.EngineTestHarness.runAll;
    window.EngineTestHarness.runAll=async function(){
      const ids=['synthetic-a','synthetic-b','synthetic-c'],previous=new Map(ids.map(id=>[id,services.templates.get(id)]));
      for(const id of ids)services.templates.set(id,{entity_id:id,animation_class:'none',interaction_class:'none',tags:['test'],components:{Transform:{x:.5,y:.5},Sprite:{color:'accent',radius:.02}}});
      try{return await runHarness()}finally{for(const [id,def] of previous)if(def)services.templates.set(id,def);else services.templates.delete(id)}
    };

    async function boot(){
      try{
        services.data=normalizeGameData(await loadPackageData());
        if(!services.data){services.state.screen='error';services.save.initialize();services.ui=new UIController(services);services.ui.init();initializeGame();return}
        registerTemplates(services.data);
        const report=validateGameData(services.data);
        for(const warning of report.warnings)diagnostics.report('DataValidator',warning.code,'warning',warning.context,'review data contract');
        if(!report.valid){for(const error of report.errors)diagnostics.report('DataValidator',error.code,'error',error.context,'repair data or use safe fallback');services.state.screen='error';services.save.initialize();services.ui=new UIController(services);services.ui.init();initializeGame();return}
        const palette=services.data.theme.palette||{};for(const [name,key] of [['--bg','background'],['--panel','panel'],['--panel2','panel_alt'],['--line','line'],['--ink','text'],['--muted','muted'],['--accent','accent'],['--danger','danger'],['--warn','warning']])if(palette[key])document.documentElement.style.setProperty(name,palette[key]);if(services.data.theme.font)document.documentElement.style.fontFamily=services.data.theme.font;
        services.state.screen='splash';installSystems();attachFlowActions();initializeGame();setTimeout(()=>{if(services.state.screen==='splash'){services.state.screen='title';services.ui.render()}},1500);
      }catch(error){diagnostics.report('Runtime','initialization','error',{message:error.message,stack:error.stack},'recoverable diagnostics screen');services.state.screen='error';services.ui??=new UIController(services);services.ui.render();if(!services.game)initializeGame()}
    }
    boot();
  })();
